
name: Build LSMS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Update dependency lockfile
        working-directory: lsms-app
        run: npm install --package-lock-only

      - name: Save updated lockfile
        run: |
          if ! git diff --quiet -- lsms-app/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lsms-app/package-lock.json
            git commit -m "Update LSMS dependency lockfile"
            git push
          fi

      - name: Build LSMS
        working-directory: lsms-app
        run: |
          npm ci
          npm run build
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build Android APK
        working-directory: lsms-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LSMS-Android-APK
          path: lsms-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
